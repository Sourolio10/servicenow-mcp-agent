[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servicenow-mcp-agent"
version = "0.1.0"
description = "An MCP server exposing ServiceNow-style ITSM tools, a Claude agent that drives it, and an eval harness measuring tool-selection accuracy, task completion and latency."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "servicenow", "itsm", "claude", "agent", "evals"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.0.0",
    "anthropic>=1.0.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ruff>=0.4",
]

[project.scripts]
snow-mcp-server = "snow_mcp.server:main"
snow-agent = "snow_mcp.agent.cli:main"
snow-evals = "snow_mcp.evals.cli:main"
snow-mock-api = "snow_mcp.mock_api.app:main"

[project.urls]
Homepage = "https://github.com/your-username/servicenow-mcp-agent"
Issues = "https://github.com/your-username/servicenow-mcp-agent/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/snow_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
